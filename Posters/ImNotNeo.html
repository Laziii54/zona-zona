    <script>
        const translations = {
            en: {
                loaderText: "ZONA | SECTOR",
                home: "home", gallery: "gallery", bio: "bio", contact: "contact",
                langToggle: "EN",
                releaseTag: "Short Film · 2024",
                filmTitle: "I'm Not Neo",
                tagline: "A ZONA | SECTOR production",
                watchBtnText: "Watch Film",
                backText: "Back to all works",
                description: "A short film by ZONA | SECTOR. Identity, illusion, and the search for self — told through the raw lens of independent Georgian cinema.",
                directorLabel: "Director",
                directorValue: "ZONA | SECTOR",
                yearLabel: "Year",
                genreLabel: "Genre",
                genreValue: "Short Film",
                productionLabel: "Production",
                stillsLabel: "Stills",
                VideoLabel: "Film",
                closeText: "Close",
                footer: "Our collective brings together directors, actors, composers, sound designers, and visual artists."
            },
            ge: {
                loaderText: "ზონა | სექტორი",
                home: "მთავარი", gallery: "გალერეა", bio: "ბიო", contact: "კონტაქტი",
                langToggle: "ქარ",
                releaseTag: "მოკლემეტრაჟიანი · 2024",
                filmTitle: "მე არ ვარ ნეო",
                tagline: "ზონა | სექტორის პროდაქშენი",
                watchBtnText: "ფილმის ნახვა",
                backText: "ყველა ნამუშევარი",
                description: "ზონა | სექტორის მოკლემეტრაჟიანი ფილმი. იდენტობა, ილუზია და საკუთარი თავის ძიება — დამოუკიდებელი ქართული კინოს უხეში ობიექტივით მოთხრობილი.",
                directorLabel: "რეჟისორი",
                directorValue: "ზონა | სექტორი",
                yearLabel: "წელი",
                genreLabel: "ჟანრი",
                genreValue: "მოკლემეტრაჟიანი",
                productionLabel: "პროდაქშენი",
                stillsLabel: "კადრები",
                VideoLabel: "ფილმი",
                closeText: "დახურვა",
                footer: "ჩვენი კოლექტივი აერთიანებს რეჟისორებს, მსახიობებს, კომპოზიტორებს, ხმის დიზაინერებსა და ვიზუალურ არტისტებს."
            }
        };

        const toggleBtns = document.querySelectorAll(".langToggle");
        let currentLang = localStorage.getItem("lang") || "en";

        function updateText(lang) {
            document.querySelectorAll("[data-key]").forEach(el => {
                const key = el.getAttribute("data-key");
                if (translations[lang][key] !== undefined) el.innerText = translations[lang][key];
            });
            document.documentElement.lang = lang === "ge" ? "ka" : "en";
            localStorage.setItem("lang", lang);
            currentLang = lang;
        }

        toggleBtns.forEach(btn => {
            btn.addEventListener("click", () => updateText(currentLang === "en" ? "ge" : "en"));
        });

        updateText(currentLang);
    </script>

    <script src="Global.js"></script>

</body>
