<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona | Gallery</title>
    <link rel="stylesheet" href="Gallery.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../Photos/icon.png" id="favicon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div id="loader">
        <div class="loader-content">
            <img id="loaderImg" src="../Photos/icon.png" alt="ZONA Logo">
            <span data-key="loaderText">ZONA | SECTOR</span>
        </div>
    </div>

    <header class="header">
        <nav class="nav-links section">
            <button class="burger" id="burger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="respo-disp">
                <a href="../index.html" class="nav-item">
                    <img src="../Photos/icon.png" alt="zona-icon" class="zona-icon primary-img">
                    <img src="../Photos/hovericon.png" alt="zona-icon-hover" class="zona-icon hover-img">
                </a>
            </div>
            <div class="main-links">
                <a href="../index.html" class="nav-item" data-key="home"></a>
                <a href="#" class="nav-item" data-key="gallery"></a>
                <a href="../Bio/Bio.html" class="nav-item" data-key="bio"></a>
                <a href="../Contact/Contact.html" class="nav-item" data-key="contact"></a>
            </div>
            <div class="icons">
                <a href="https://www.instagram.com/zona.sector?utm_source=qr" class="nav-item" target="_blank"><i
                        class="fa-brands fa-instagram"></i></a>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=zona.sector54@gmail.com" class="nav-item"
                    target="_blank"><i class="fa-regular fa-envelope"></i></a>
                <button class="langToggle" data-key="langToggle">EN</button>
            </div>
        </nav>

        <div class="mobile-menu" id="mobileMenu">
            <a href="../index.html" data-key="home"></a>
            <a href="#" data-key="gallery"></a>
            <a href="../Bio/Bio.html" data-key="bio"></a>
            <a href="../Contact/Contact.html" data-key="contact"></a>
            <div class="mobile-icons">
                <a href="https://www.instagram.com/zona.sector?utm_source=qr" target="_blank"><i
                        class="fa-brands fa-instagram"></i></a>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=zona.sector54@gmail.com" target="_blank"><i
                        class="fa-regular fa-envelope"></i></a>
                <button class="langToggle" data-key="langToggle">EN</button>
            </div>
        </div>
    </header>

    <div class="gallery" id="gallery"></div>

    <div class="lb" id="lb">
        <button class="lb-close" id="lbClose">✕</button>
        <button class="lb-prev" id="lbPrev">&#8592;</button>
        <img id="lbImg" src="" alt="" />
        <button class="lb-next" id="lbNext">&#8594;</button>
    </div>

    <script>
        // 1. LANGUAGE SWITCH LOGIC
        const toggleBtns = document.querySelectorAll(".langToggle");
        const translations = {
            en: {
                home: "home",
                gallery: "gallery",
                bio: "bio",
                contact: "contact",
                loaderText: "ZONA | SECTOR"
            },
            ge: {
                home: "მთავარი",
                gallery: "გალერეა",
                bio: "ბიო",
                contact: "კონტაქტი",
                loaderText: "ზონა | სექტორი",
            }
        };

        let currentLang = localStorage.getItem("lang") || "en";

        function updateText(lang) {
            document.querySelectorAll("[data-key]").forEach(el => {
                const key = el.getAttribute("data-key");
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
            document.documentElement.lang = lang === "ge" ? "ka" : "en";
            localStorage.setItem("lang", lang);
            toggleBtns.forEach(btn => btn.innerText = lang === "en" ? "EN" : "ქარ");
            currentLang = lang;
        }

        toggleBtns.forEach(btn => btn.addEventListener("click", () => {
            currentLang = currentLang === "en" ? "ge" : "en";
            updateText(currentLang);
        }));

        // 2. LOADER AND GALLERY LOGIC
        window.addEventListener("load", () => {
            const loader = document.getElementById("loader");
            setTimeout(() => {
                loader.classList.add("hidden");
                setTimeout(() => loader.remove(), 1000);
            }, 1500);
            updateText(currentLang); // ენის გააქტიურება ჩატვირთვისას
        });

        const loaderImages = ["../Photos/galleryicon1.png", "../Photos/galleryicon2.png", "../Photos/galleryicon3.png", "../Photos/galleryicon4.png"];
        let i = 0;
        const img = document.getElementById("loaderImg");
        setInterval(() => {
            i = (i + 1) % loaderImages.length;
            img.src = loaderImages[i];
        }, 300);

        document.addEventListener("DOMContentLoaded", () => {
            const burger = document.getElementById("burger");
            const mobileMenu = document.getElementById("mobileMenu");
            if (burger) {
                burger.addEventListener("click", () => {
                    burger.classList.toggle("open");
                    mobileMenu.classList.toggle("open");
                });
            }

            const photos = Array.from({ length: 81 }, (_, i) => ({ src: `GalleryPhotos/${i + 1}.jpg` }));
            let cur = 0;
            const g = document.getElementById('gallery');

            photos.forEach((p, i) => {
                const d = document.createElement('div');
                d.className = 'photo';
                d.innerHTML = `<img src="${p.src}" loading="lazy"/>`;
                d.onclick = () => openLb(i);
                g.appendChild(d);
            });

            function openLb(i) {
                cur = i;
                document.getElementById('lbImg').src = photos[i].src;
                document.getElementById('lb').classList.add('open');
            }

            function closeLb() { document.getElementById('lb').classList.remove('open'); }
            document.getElementById('lbClose').onclick = closeLb;
            document.getElementById('lbPrev').onclick = () => openLb((cur - 1 + photos.length) % photos.length);
            document.getElementById('lbNext').onclick = () => openLb((cur + 1) % photos.length);
            document.getElementById('lb').onclick = e => { if (e.target.id === 'lb') closeLb(); };
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeLb();
                if (e.key === 'ArrowLeft') openLb((cur - 1 + photos.length) % photos.length);
                if (e.key === 'ArrowRight') openLb((cur + 1) % photos.length);
            });
        });
    </script>
</body>

</html>
